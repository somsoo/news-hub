<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <!-- Google SEO & Discover Optimization -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <!-- OpenGraph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:image" content="{{IMAGE_URL}}">
    <meta property="og:site_name" content="ISSUE HUB">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="{{IMAGE_URL}}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- Schema.org NewsArticle -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsArticle",
      "headline": "{{TITLE}}",
      "description": "{{DESCRIPTION}}",
      "image": ["{{IMAGE_URL}}"],
      "datePublished": "{{ISO_DATE}}",
      "dateModified": "{{ISO_DATE}}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{CANONICAL_URL}}"
      },
      "author": {
        "@type": "Organization",
        "name": "{{SOURCE_NAME}}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "ISSUE HUB",
        "url": "https://news.enjoy-onepage.com"
      }
    }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; line-height: 1.65; padding: 16px 12px 85px; }
        
        /* 초미니멀 모바일 카드 컨테이너 */
        .card { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 20px; padding: 22px 18px 26px; box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; }

        /* 상단 태그 & 날짜 */
        .top-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .tag-pill { background: #fee2e2; color: #dc2626; font-size: 0.78rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; letter-spacing: -0.2px; }
        .date-text { font-size: 0.78rem; color: #94a3b8; }

        /* 헤드라인 */
        .title { font-size: 1.25rem; font-weight: 800; line-height: 1.4; color: #0f172a; letter-spacing: -0.4px; margin-bottom: 14px; word-break: keep-all; }

        /* 썸네일 이미지 (있을 경우만) */
        .thumb-box, .thumb-wrap { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 14px; background: #f1f5f9; }
        .thumb-box img, .thumb-wrap img { width: 100%; height: auto; max-height: 260px; object-fit: cover; display: block; }

        /* 초단문 사연 훅 (단 2~3줄로 호기심 극대화) */
        .story-hook { font-size: 0.98rem; color: #334155; line-height: 1.7; margin-bottom: 18px; word-break: keep-all; background: #f8fafc; padding: 14px 14px; border-radius: 12px; border-left: 3.5px solid #ef4444; }

        /* [핵심] 블러 가림막 섹션 (단 하나의 행동 유도) */
        .blur-box { position: relative; border-radius: 14px; overflow: hidden; border: 1.5px dashed #f87171; background: #fff1f2; margin-top: 10px; }
        .blur-text { padding: 18px 14px 60px; filter: blur(5px); opacity: 0.45; user-select: none; pointer-events: none; line-height: 1.75; font-size: 0.94rem; color: #1e293b; }
        
        .blur-mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,241,242,0.2) 0%, rgba(255,241,242,0.85) 25%, #fff1f2 80%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 14px; text-align: center; }
        
        .lock-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 800; color: #be123c; background: #ffe4e6; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
        .lock-msg { font-size: 0.92rem; font-weight: 800; color: #881337; margin-bottom: 14px; word-break: keep-all; letter-spacing: -0.3px; }

        /* 단 하나의 초대형 메인 클릭 버튼 */
        .btn-unlock { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 380px; background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); color: #ffffff !important; text-decoration: none; font-size: 1.05rem; font-weight: 900; padding: 16px 14px; border-radius: 14px; box-shadow: 0 8px 24px rgba(225, 29, 72, 0.35); transition: transform 0.15s, box-shadow 0.15s; letter-spacing: -0.4px; animation: pulse-ring 2s infinite; }
        .btn-unlock:active { transform: scale(0.97); }
        .btn-unlock span.arrow { font-size: 1.2rem; }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
            70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        .btn-subtext { font-size: 0.72rem; color: #9f1239; margin-top: 9px; }

        /* 하단 출처 & 고지 */
        .footer-note { max-width: 480px; margin: 16px auto 0; text-align: center; font-size: 0.72rem; color: #94a3b8; line-height: 1.5; }
        .footer-note a { color: #64748b; text-decoration: underline; }

        /* 모바일 하단 단일 고정 바 (뭘 누를지 고민 제로) */
        .bottom-sticky { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); padding: 10px 14px 12px; z-index: 999; box-shadow: 0 -4px 16px rgba(0,0,0,0.12); }
        .sticky-btn-full { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 480px; margin: 0 auto; background: #e11d48; color: #ffffff !important; text-decoration: none; font-size: 0.98rem; font-weight: 800; padding: 13px 16px; border-radius: 12px; letter-spacing: -0.3px; box-shadow: 0 4px 14px rgba(225,29,72,0.4); }
    </style>
</head>
<body>

    <!-- 메인 단일 카드 (잡다한 배너/상단바/추천뉴스 완전 제거) -->
    <main class="card">
        <div class="top-meta">
            <span class="tag-pill">🔥 {{CATEGORY_TAG}}</span>
            <span class="date-text">{{DATE}}</span>
        </div>

        <h1 class="title">{{TITLE}}</h1>

        {{IMAGE_BLOCK}}

        <!-- 초단문 핵심 훅 (읽자마자 결말이 궁금해지는 2~3줄) -->
        <div class="story-hook">
            {{STORY_INTRO}}
        </div>

        <!-- 블러 가림막 & 단 하나의 명확한 언락 버튼 -->
        <div class="blur-box">
            <div class="blur-text">
                <p>{{BLUR_TEASER}}</p>
                <p>{{BLUR_TEASER_2}}</p>
            </div>
            <div class="blur-mask">
                <div class="lock-badge">
                    <span>🔒 결말 및 후속 내용 가림</span>
                </div>
                <div class="lock-msg">가장 중요한 후속 결말이 가려져 있습니다</div>
                
                <a href="{{AFFILIATE_URL}}" target="_blank" rel="noopener noreferrer" class="btn-unlock">
                    <span>👉 {{CTA_TEASER}}</span>
                    <span class="arrow">➔</span>
                </a>
                <span class="btn-subtext">언론사 원문 기사에서 전체 확인</span>
            </div>
        </div>
    </main>

    <!-- 하단 심플 고지 -->
    <footer class="footer-note">
        출처: {{SOURCE_NAME}} &bull; 뉴스픽 파트너스 활동의 일환으로 수수료를 제공받을 수 있습니다.
    </footer>

    <!-- 모바일 하단 플로팅 단일 바 -->
    <div class="bottom-sticky">
        <a href="{{AFFILIATE_URL}}" target="_blank" rel="noopener noreferrer" class="sticky-btn-full">
            <span>👉 {{CTA_TEASER}}</span>
            <span>➔</span>
        </a>
    </div>

</body>
</html>
